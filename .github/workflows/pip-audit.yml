name: Python Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pip-audit:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r api/requirements.txt

  pip-outdated:
    name: Python Outdated Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Check for outdated packages
        run: |
          echo "=== Checking outdated Python packages ==="
          pip list --outdated --format=json > outdated.json
          cat outdated.json

          COUNT=$(python3 -c "import json; data=json.load(open('outdated.json')); print(len(data))")
          echo "Found $COUNT outdated packages"

          if [ "$COUNT" -gt "0" ]; then
            echo "FAIL: $COUNT outdated package(s) detected. Please upgrade dependencies."
            exit 1
          fi
