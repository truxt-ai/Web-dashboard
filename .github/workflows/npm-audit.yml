name: NPM Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  npm-audit:
    name: NPM Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run npm audit
        working-directory: ./app
        run: npm audit --audit-level=moderate

  npm-outdated:
    name: NPM Outdated Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Check for outdated packages
        working-directory: ./app
        run: |
          echo "=== Checking for outdated packages ==="
          npm outdated --json > outdated.json 2>&1 || true
          cat outdated.json

          # Fail if any packages are more than 1 major version behind
          node -e "
            const data = require('./outdated.json');
            const keys = Object.keys(data);
            if (keys.length > 0) {
              console.error('FAIL: ' + keys.length + ' outdated package(s) found:');
              keys.forEach(k => {
                const p = data[k];
                console.error('  ' + k + ': current=' + p.current + ' wanted=' + p.wanted + ' latest=' + p.latest);
              });
              process.exit(1);
            }
          "
