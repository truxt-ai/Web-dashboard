name: Dependency Health Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC

jobs:
  dependency-health:
    name: Dependency Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install pip-audit pip-check
          npm install -g npm-check-updates

      - name: Node.js dependency report
        working-directory: ./app
        run: |
          npm install
          echo "### NPM Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit 2>&1 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### NPM Outdated Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm outdated 2>&1 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Python dependency report
        run: |
          pip install -r api/requirements.txt -q
          echo "### pip-audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pip-audit -r api/requirements.txt 2>&1 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Python Outdated Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pip list --outdated 2>&1 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Enforce minimum version requirements
        run: |
          python3 << 'EOF'
          import subprocess, sys, json

          MINIMUM_VERSIONS = {
              "Flask": "2.0.0",
              "requests": "2.28.0",
              "Pillow": "9.0.0",
              "PyYAML": "6.0",
              "cryptography": "38.0.0",
              "urllib3": "1.26.5",
              "SQLAlchemy": "1.4.0",
          }

          result = subprocess.run(
              ["pip", "show"] + list(MINIMUM_VERSIONS.keys()),
              capture_output=True, text=True
          )

          installed = {}
          current_pkg = None
          for line in result.stdout.splitlines():
              if line.startswith("Name:"):
                  current_pkg = line.split(": ", 1)[1].strip()
              elif line.startswith("Version:") and current_pkg:
                  installed[current_pkg] = line.split(": ", 1)[1].strip()

          from packaging.version import Version
          failures = []
          subprocess.run(["pip", "install", "packaging", "-q"])

          import importlib
          packaging = importlib.import_module("packaging.version")
          Version = packaging.Version

          for pkg, min_ver in MINIMUM_VERSIONS.items():
              if pkg in installed:
                  current = installed[pkg]
                  if Version(current) < Version(min_ver):
                      failures.append(f"{pkg}: {current} < required {min_ver}")

          if failures:
              print("FAIL: Packages below minimum required versions:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print("All packages meet minimum version requirements")
          EOF
